name: Test du build
permissions:
  contents: read

on:
  push:

jobs:
  build-front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front # This ensures all 'run' commands start inside the front folder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          # Use ci (clean install) for more reliable builds if you have a lockfile
          # Or stick to 'install' if you prefer deleting the lockfile manually
          npm install --legacy-peer-deps

      - name: Fix platform-specific binaries
        run: |
          # Install the linux-specific binaries directly from the 'front' root
          npm install @rollup/rollup-linux-x64-gnu @swc/core-linux-x64-gnu --save-optional

      - name: Build frontend
        run: npm run build
