name: Déploiements

on:
  release:
    types: [created]

concurrency:
  group: production-deploy # Groupement simplifié pour la concurrence
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  repository-projects: write

jobs:
  deploy-back:
    runs-on: ubuntu-latest
    environment: back-production
    steps:
      - name: Déclencher le déploiement Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$deploy_url"

  deploy-front:
    runs-on: ubuntu-latest
    environment: front-production
    defaults:
      run:
        working-directory: front # Toutes les commandes 'run' s'exécutent ici
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          # Installation propre des binaires sans navigation manuelle dans node_modules
          npm install @rollup/rollup-linux-x64-gnu @swc/core-linux-x64-gnu --save-optional

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MATOMO_URL: ${{ secrets.VITE_MATOMO_URL }}
          VITE_MATOMO_SITE_ID: ${{ secrets.VITE_MATOMO_SITE_ID }}
        run: npm run build

      - name: Deploy Frontend to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOSTNAME }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: "front/dist/" # On garde le chemin complet pour l'action FTP
          server-dir: "observatoire-billets-train/"
